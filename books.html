<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
</head>
<body>
    <script>
        // JSON from Q1 stored in a JavaScript variable
        const bookData = {
            "Books": [
                {
                    "title": "The Great Gatsby",
                    "author": "F. Scott Fitzgerald",
                    "publicationYear": 1925,
                    "genres": ["Fiction", "Classics"]
                },
                {
                    "title": "To Kill a Mockingbird",
                    "author": "Harper Lee",
                    "publicationYear": 1960,
                    "genres": ["Fiction", "Coming-of-Age"]
                }
            ]
        };

        // (a) The title of the first book
        console.log(bookData.Books[0].title);

        // (b) The author of the second book
        console.log(bookData.Books[1].author);

        // (c) The genres of all books (loop through the array)
        for (let i = 0; i < bookData.Books.length; i++) {
            console.log(bookData.Books[i].genres);
        }
    </script>
</body>
</html>
